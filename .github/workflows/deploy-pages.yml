name: Deploy to GitHub Pages

# Publishes the PWA to https://bassyj32-ui.github.io/MalariaX/ on every push to
# main, so a deploy needs no local step and no paid account.
#
# Pages has no serverless runtime, which means /api/ask (the DeepSeek proxy) is
# unavailable there. The app is built to degrade: prevention answers fall back to
# a curated offline set, and the risk map is computed on-device anyway. If the AI
# assistant is wanted in production, deploy to Vercel instead — see the README.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npx vitest run

      # The safety suites gate the deploy. A change that weakens the escalation
      # contract must not reach users.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /MalariaX/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4